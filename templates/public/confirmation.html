<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demande envoyee - {{ tenant.nom_agence }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center">
    <div class="max-w-md mx-4 bg-white p-8 rounded-xl border border-gray-100 shadow-sm text-center">
        <p class="text-4xl mb-3">✅</p>
        <h1 class="text-xl font-bold text-gray-900 mb-2">Demande envoyee !</h1>
        <p class="text-gray-600 text-sm">
            {{ tenant.nom_agence }} va vous contacter au sujet de votre demande pour
            {{ reservation.vehicule.marque }} {{ reservation.vehicule.modele }}
            du {{ reservation.date_depart }} au {{ reservation.date_retour }}.
        </p>
        <a href="{% url 'page_agence' tenant.slug_unique %}" class="inline-block mt-6 text-blue-600 text-sm hover:underline">Retour aux vehicules</a>
    </div>
</body>
</html>
